<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FracHIV-SITA Lab{% endblock %}</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Plotly -->
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

  <!-- App CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">
</head>
<body>

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="loading-overlay d-none">
    <div class="loading-inner">
      <div class="spinner-ring"></div>
      <p class="loading-text">Running Simulation…</p>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3" style="z-index:9999"></div>

  <!-- Navbar -->
  <nav class="topbar navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid px-4">
      <a class="navbar-brand brand" href="{{ url_for('home') }}">
        <span class="brand-mark"><i class="fa fa-dna"></i></span>
        <div class="brand-text">
          <span class="brand-title">FracHIV-SITA Lab</span>
          <span class="brand-sub">Fractional-Order HIV Simulator</span>
        </div>
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
        <span class="fa fa-bars"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMain">
        <div class="navbar-nav ms-auto gap-1 align-items-center">
          <a href="{{ url_for('home') }}" class="nav-link nav-pill {% if request.endpoint == 'home' %}active{% endif %}">
            <i class="fa fa-house me-1"></i>Overview
          </a>
          <a href="{{ url_for('dashboard') }}" class="nav-link nav-pill {% if request.endpoint == 'dashboard' %}active{% endif %}">
            <i class="fa fa-flask me-1"></i>Simulator
          </a>
          <a href="{{ url_for('documentation') }}" class="nav-link nav-pill {% if request.endpoint == 'documentation' %}active{% endif %}">
            <i class="fa fa-book me-1"></i>Docs
          </a>
          <a href="{{ url_for('about') }}" class="nav-link nav-pill {% if request.endpoint == 'about' %}active{% endif %}">
            <i class="fa fa-circle-info me-1"></i>About
          </a>
          <a href="{{ url_for('dashboard') }}" class="btn btn-glow ms-2">
            <i class="fa fa-play me-1"></i>Launch Lab
          </a>
        </div>
      </div>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container-fluid px-4 d-flex flex-wrap justify-content-between align-items-center gap-2">
      <span><i class="fa fa-dna me-2 text-primary-glow"></i>FracHIV-SITA Lab &mdash; Applied Mathematics Thesis Dashboard</span>
      <span class="text-muted small">Not for clinical prediction &bull; Academic use only</span>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- App JS -->
  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script src="{{ url_for('static', filename='js/validation.js') }}"></script>
  <script src="{{ url_for('static', filename='js/animation.js') }}"></script>
  <script src="{{ url_for('static', filename='js/charts.js') }}"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
